name: Deploy to GitHub Pages

# Publica a pasta site-chatgpt: cópia estática do site que a Karina montou no
# ChatGPT (out/2026). O projeto Vite antigo continua neste repositório, intocado.
# Para voltar a ele: tag site-antigo-2026-10, ou trocar o job build de volta para
# npm ci + npm run build + path: dist.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-chatgpt

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
